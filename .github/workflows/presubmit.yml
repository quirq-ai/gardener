# Required check for this repo. Hand-written until infra-config generates builders for infra repos.
# Runs on every PR and in the merge queue, so it verifies the exact merge result.
name: presubmit
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  presubmit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: read the infra-config pin
        id: pin
        run: python -c "import tomllib; print('commit=' + tomllib.load(open('pins.toml', 'rb'))['infra-config']['commit'])" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/infra-config
          ref: ${{ steps.pin.outputs.commit }}
          path: .qq/infra-config
          persist-credentials: false
      - name: read the gate pin
        id: gatepin
        run: python -c "import tomllib; print('commit=' + tomllib.load(open('pins.toml', 'rb'))['gate']['commit'])" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/gate
          ref: ${{ steps.gatepin.outputs.commit }}
          path: .qq/gate
          persist-credentials: false
      - name: core code names no language, build tool or deploy target (gate's agnosticism guard)
        run: |
          python -m venv .qq/gate-venv
          .qq/gate-venv/bin/pip install --quiet -e .qq/gate
          .qq/gate-venv/bin/qqgate guard --repo gardener --github .
      - run: python -m pip install --quiet -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider
      - name: every main commit has a post-submit result (V0-GAR-01 done-when, offline half)
        run: |
          qqgarden status --config .qq/infra-config --backend snapshot \
            --snapshot tests/fixtures/every-commit.json --now 2026-10-04T12:00:00+00:00 --require-coverage
          rc=0; qqgarden status --config .qq/infra-config --backend snapshot \
            --snapshot tests/fixtures/batched-push.json --now 2026-10-04T12:00:00+00:00 --require-coverage || rc=$?
          [ "$rc" -eq 1 ] || { echo "::error::a main commit without a post-submit result was not caught (exit $rc)"; exit 1; }
      - name: a planted break is bisected to its commit (V0-GAR-02 done-when)
        shell: bash   # pipefail, so a failing bisect is not hidden by tee
        run: |
          eval "$(tools/plant-break.sh "$RUNNER_TEMP/planted" 12 7)"
          qqgarden bisect --config .qq/infra-config --repo-dir "$RUNNER_TEMP/planted" \
            --good "$good" --bad "$bad" --run ./check.sh --json | tee "$RUNNER_TEMP/bisect.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); sys.exit(not (r['culprit']==sys.argv[2] and r['verified']))" \
            "$RUNNER_TEMP/bisect.json" "$culprit" || { echo "::error::bisection did not name the planted culprit $culprit"; exit 1; }
      - name: a planted build break is reverted within 30 min, and an 11th revert in 24 h is refused (V0-GAR-03 done-when, offline half)
        run: python -m pytest -q -p no:cacheprovider tests/test_cycle.py::test_planted_build_break_is_reverted_within_30_minutes tests/test_policy.py::test_flood_refuses_the_eleventh_revert_in_24h -v
      - name: every auto-revert links culprit, revert and fix (V0-GAR-04 done-when, offline half)
        run: python -m pytest -q -p no:cacheprovider tests/test_records.py::test_every_auto_revert_links_culprit_revert_and_fix -v
