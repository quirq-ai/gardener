# Tree status and red detection (V0-GAR-01). Reads every onboarded repo's main history and its
# post-submit runs, and publishes one status per repo to this repo's `tree-status` branch:
#   status/<repo>.json  (schema qq-tree-status/1: open, closed or unknown, with regression ranges)
#   status/README.md    (the same as a table)
# It commits only when a status changes, so the branch history is the tree's open/close log.
# The job fails when a main commit since onboarding has no post-submit result (GAR-01 done-when).
#
# The `cycle` job then gardens (V0-GAR-03): it groups failures, and for each verified culprit makes
# a clean revert within infra-config's auto_revert.toml caps, counted in the `ledger` branch. It
# needs the bot identity secret QQ_GARDENER_TOKEN (TODO(suraj)); without it, it reports what it
# would do and creates nothing. It runs no code from the repos it gardens, only `git revert`.
name: tree-status
on:
  schedule:
    - cron: "2-59/5 * * * *"    # every 5 min, off the hour: a break is reverted within 30 min
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tree-status            # one writer to the tree-status branch at a time
  cancel-in-progress: false
jobs:
  tree-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write           # push to this repo's tree-status branch only
      actions: read             # read the onboarded repos' post-submit runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: read the infra-config pin
        id: pin
        run: python -c "import tomllib; print('commit=' + tomllib.load(open('pins.toml', 'rb'))['infra-config']['commit'])" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/infra-config
          ref: ${{ steps.pin.outputs.commit }}
          path: .qq/infra-config
          persist-credentials: false
      - run: python -m pip install --quiet .
      - name: open the tree-status branch
        run: |
          if git fetch --depth 1 origin tree-status; then
            git worktree add -B tree-status .qq/publish FETCH_HEAD
          else
            git worktree add --orphan -b tree-status .qq/publish
          fi
      - name: compute the tree status
        id: status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rc=0
          qqgarden status --config .qq/infra-config --out .qq/publish/status --require-coverage \
            > "$RUNNER_TEMP/summary.md" || rc=$?
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" -le 1 ] || exit "$rc"      # 2 is a gardener error: nothing to publish
      - name: publish changes
        working-directory: .qq/publish
        run: |
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          msg=$(python3 - <<'PY'
          import glob, json
          states = [json.load(open(p)) for p in sorted(glob.glob("status/*.json"))]
          print(", ".join(f"{d['repo']} {d['state']}" for d in states))
          PY
          )
          [ -n "$msg" ] || { echo "::error::no status files to describe"; exit 1; }
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "tree-status: $msg"
          git push origin tree-status
      - name: every main commit has a post-submit result (V0-GAR-01 done-when)
        if: steps.status.outputs.rc != '0'
        run: |
          echo "::error::a main commit since onboarding has no post-submit result; see the summary"
          exit 1

  cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write           # push to this repo's ledger branch only
      actions: read
      issues: write             # failure-record mirrors and postmortem stubs in this repo (V0-GAR-04)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: read the infra-config pin
        id: pin
        run: python -c "import tomllib; print('commit=' + tomllib.load(open('pins.toml', 'rb'))['infra-config']['commit'])" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/infra-config
          ref: ${{ steps.pin.outputs.commit }}
          path: .qq/infra-config
          persist-credentials: false
      - run: python -m pip install --quiet .
      - name: open the ledger branch
        run: |
          # Start an empty ledger only when the branch truly does not exist: an empty ledger on a
          # fetch error would count zero reverts and let the cap be exceeded.
          rc=0; git ls-remote --exit-code --heads origin ledger > /dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            git fetch --depth 50 origin ledger
            git worktree add -B ledger .qq/ledger FETCH_HEAD
          elif [ "$rc" -eq 2 ]; then
            git worktree add --orphan -b ledger .qq/ledger
          else
            echo "::error::could not read the ledger branch (git ls-remote exit $rc)"; exit 1
          fi
      - name: garden (group, verify, revert within caps)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QQ_GARDENER_TOKEN: ${{ secrets.QQ_GARDENER_TOKEN }}
        run: |
          set -o pipefail
          qqgarden cycle --config .qq/infra-config --ledger .qq/ledger --publish-ledger ledger \
            | tee -a "$GITHUB_STEP_SUMMARY"
