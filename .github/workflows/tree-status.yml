# Tree status and red detection (V0-GAR-01). Reads every onboarded repo's main history and its
# post-submit runs, and publishes one status per repo to this repo's `tree-status` branch:
#   status/<repo>.json  (schema qq-tree-status/1: open, closed or unknown, with regression ranges)
#   status/README.md    (the same as a table)
# It commits only when a status changes, so the branch history is the tree's open/close log.
# The job fails when a main commit since onboarding has no post-submit result (GAR-01 done-when).
#
# The `cycle` job then gardens (V0-GAR-03): it groups failures, and for each verified culprit makes
# a clean revert within infra-config's auto_revert.toml caps, counted in the `ledger` branch. Its
# writes (revert PRs, re-runs, backfill dispatches) use a short-lived token of the gardener's own
# GitHub App, "quirq gardener". TODO(suraj): create it with repository permissions contents: write
# (revert branches), pull requests: write (revert PRs), actions: write (re-run a culprit's
# post-submit, dispatch backfills) and metadata: read, nothing else, installed on the onboarded
# repos only; store its client id and private key as QQ_GARDENER_APP_CLIENT_ID and
# QQ_GARDENER_APP_PRIVATE_KEY in this repo's `quirq-gardener` environment, limited to main. Install
# it on a repo before infra-config onboards that repo. Without it the cycle reports what it would
# do and creates nothing.
# It runs no code from the repos it gardens, only `git revert`. Branches are always named in full
# (refs/heads/...), so a tag of the same name never stands in for one. Next to its write tokens it runs
# only this repo's code and qqresults (pins.toml) from source, plus requirements/runtime.lock
# (exact versions, hash-checked wheels). No checkout keeps credentials: only the steps that push
# (or read runs and write issues through the API) get the job token, in their own environment.
#
# The ledger is the cap's memory, so a missing `ledger` branch is an error, never an empty ledger.
# The first run starts it by hand: Actions > tree-status > Run workflow, with bootstrap-ledger.
# TODO(suraj): branch rulesets on `ledger` and `tree-status` (no deletion, no force push, updates
# only by github-actions[bot]); asked of gate with the other org settings.
name: tree-status
on:
  schedule:
    # GitHub fires schedules best-effort: on 2026-10-04 this cron ran twice in 7 hours. The `next`
    # job below keeps the 5-minute cadence; the cron only restarts that chain if it stops.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      bootstrap-ledger:
        description: "Start an empty ledger branch (once, before the first revert; never if it existed)"
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tree-status            # one writer to the tree-status branch at a time
  cancel-in-progress: false
jobs:
  tree-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write           # push to this repo's tree-status branch only
      actions: read             # read the onboarded repos' post-submit runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: read the pins
        id: pin
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          pins = tomllib.load(open("pins.toml", "rb"))
          print("commit=" + pins["infra-config"]["commit"])
          print("results=" + pins["test-pipelines"]["commit"])
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/infra-config
          ref: ${{ steps.pin.outputs.commit }}
          path: .qq/infra-config
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/test-pipelines
          ref: ${{ steps.pin.outputs.results }}
          path: .qq/test-pipelines
          persist-credentials: false
      - name: install (hash-checked wheels only; qqgarden and qqresults from source)
        run: |
          python -m pip install --quiet --require-hashes --no-deps --only-binary :all: -r requirements/runtime.lock
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/.qq/test-pipelines/src" >> "$GITHUB_ENV"
      - name: open the tree-status branch
        run: |
          if git fetch --depth 1 origin refs/heads/tree-status; then
            git worktree add -B tree-status .qq/publish FETCH_HEAD
          else
            git worktree add --orphan -b tree-status .qq/publish
          fi
      - name: compute the tree status
        id: status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rc=0
          python -m qqgarden.cli status --config .qq/infra-config --out .qq/publish/status --require-coverage \
            > "$RUNNER_TEMP/summary.md" || rc=$?
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" -le 1 ] || exit "$rc"      # 2 is a gardener error: nothing to publish
      - name: publish changes
        working-directory: .qq/publish
        env:
          TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          msg=$(python3 - <<'PY'
          import glob, json
          states = [json.load(open(p)) for p in sorted(glob.glob("status/*.json"))]
          print(", ".join(f"{d['repo']} {d['state']}" for d in states))
          PY
          )
          [ -n "$msg" ] || { echo "::error::no status files to describe"; exit 1; }
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "tree-status: $msg"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c "http.https://github.com/${GITHUB_REPOSITORY}.extraheader=AUTHORIZATION: basic $auth" \
              push origin HEAD:refs/heads/tree-status
      - name: every main commit has a post-submit result (V0-GAR-01 done-when)
        if: steps.status.outputs.rc != '0'
        run: |
          echo "::error::a main commit since onboarding has no post-submit result; see the summary"
          exit 1

  cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: quirq-gardener   # holds the App's secrets; deployments limited to main
    env:
      HAS_BOT: ${{ secrets.QQ_GARDENER_APP_CLIENT_ID != '' }}   # secrets are not readable in a step's `if`
    permissions:
      contents: write           # push to this repo's ledger branch only
      actions: read
      issues: write             # failure-record mirrors and postmortem stubs in this repo (V0-GAR-04)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: read the pins
        id: pin
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          pins = tomllib.load(open("pins.toml", "rb"))
          print("commit=" + pins["infra-config"]["commit"])
          print("results=" + pins["test-pipelines"]["commit"])
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/infra-config
          ref: ${{ steps.pin.outputs.commit }}
          path: .qq/infra-config
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/test-pipelines
          ref: ${{ steps.pin.outputs.results }}
          path: .qq/test-pipelines
          persist-credentials: false
      - name: install (hash-checked wheels only; qqgarden and qqresults from source)
        run: |
          python -m pip install --quiet --require-hashes --no-deps --only-binary :all: -r requirements/runtime.lock
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/.qq/test-pipelines/src" >> "$GITHUB_ENV"
      - name: onboarded repos
        id: repos
        run: |
          # The App token covers exactly the repos infra-config onboards in this org, nothing else.
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from qqgarden import config
          import re
          names = [r.slug.split("/", 1)[1] for r in config.repos(config.load(Path(".qq/infra-config")))
                   if r.slug.startswith("quirq-ai/")]
          bad = [n for n in names if not re.fullmatch(r"[A-Za-z0-9._-]+", n)]
          if bad:
              raise SystemExit(f"not a repo name: {bad!r}")
          print("names=" + ",".join(names))
          PY
      - name: bot token
        id: bot
        if: env.HAS_BOT == 'true' && steps.repos.outputs.names != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.QQ_GARDENER_APP_CLIENT_ID }}
          private-key: ${{ secrets.QQ_GARDENER_APP_PRIVATE_KEY }}
          owner: quirq-ai
          repositories: ${{ steps.repos.outputs.names }}
          permission-contents: write        # revert branches
          permission-pull-requests: write   # revert PRs, auto-merge once auto_land_repos allows
          permission-actions: write         # re-runs that verify a culprit, backfill dispatches
      - name: open the ledger branch
        id: ledger
        env:
          BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap-ledger }}
          TOKEN: ${{ github.token }}
        run: |
          # Start an empty ledger only when the branch does not exist and a person asked for it: an
          # empty ledger after a fetch error or a deletion would count zero reverts.
          [ "$(git remote get-url origin)" = "https://github.com/${GITHUB_REPOSITORY}" ] \
            || { echo "::error::unexpected origin $(git remote get-url origin)"; exit 1; }
          rc=0; git ls-remote --exit-code origin refs/heads/ledger > /dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            git fetch --depth 50 origin refs/heads/ledger
            git worktree add -B ledger .qq/ledger FETCH_HEAD
            echo "publish=ledger" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 2 ] && [ "$BOOTSTRAP" = "true" ]; then
            git worktree add --orphan -b ledger .qq/ledger
            auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
            git -C .qq/ledger -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q --allow-empty -m "ledger: start (bootstrap-ledger by ${GITHUB_ACTOR})"
            git -C .qq/ledger -c "http.https://github.com/${GITHUB_REPOSITORY}.extraheader=AUTHORIZATION: basic $auth" \
                push origin HEAD:refs/heads/ledger
            echo "publish=ledger" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 2 ] && [ "$HAS_BOT" != "true" ]; then
            # No App yet: the cycle can only report, so a scratch ledger that is never pushed will do.
            echo "::warning::no ledger branch yet; reporting only until the App exists and bootstrap-ledger runs"
            git worktree add --orphan -b ledger .qq/ledger
            echo "publish=" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 2 ]; then
            echo "::error::no ledger branch: if it never existed, start it with a manual run and bootstrap-ledger;"\
                 "if it was deleted, restore it first (an empty ledger counts zero reverts)"; exit 1
          else
            echo "::error::could not read the ledger branch (git ls-remote exit $rc)"; exit 1
          fi
      - name: garden (group, verify, revert within caps)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QQ_GARDENER_TOKEN: ${{ steps.bot.outputs.token }}   # the App's installation token
          TOKEN: ${{ github.token }}          # ledger pushes; GITHUB_TOKEN above is for issues
        run: |
          set -o pipefail
          # The ledger's pushes: the job token, for this repo's URL only.
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/${GITHUB_REPOSITORY}.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          unset TOKEN
          python -m qqgarden.cli cycle --config .qq/infra-config --ledger .qq/ledger \
            --publish-ledger "${{ steps.ledger.outputs.publish }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  next:
    # Keeps the 5-minute cadence a break needs to be reverted within 30 min: each run on main
    # dispatches the next one, with no inputs, on refs/heads/main only. The concurrency group holds
    # at most one pending run and cancels the older, so the push, cron, re-run and dispatch chains
    # collapse into one; a cancelled run never chains, and the newer pending run carries it on. A
    # failed or timed-out run still chains; a chain that stops anyway is restarted by the cron.
    # Kill switch: repo variable QQ_TREE_STATUS_CHAIN=off (or disable the workflow).
    # The delay: environment `tree-status-tick`'s wait timer when it has one (no runner held while
    # waiting); otherwise this job sleeps the rest of 4.5 minutes after the run started.
    # TODO(suraj): give `tree-status-tick` a 4-minute wait timer, deployments limited to main.
    needs: [tree-status, cycle]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.QQ_TREE_STATUS_CHAIN != 'off' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: tree-status-tick
    permissions:
      actions: write            # dispatch this workflow, nothing else
    steps:
      - name: dispatch the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at)
          left=$(( 270 - ($(date +%s) - $(date -d "$started" +%s)) ))
          if [ "$left" -gt 0 ]; then sleep "$left"; fi
          for try in 1 2 3; do
            gh workflow run tree-status.yml --repo "$GITHUB_REPOSITORY" --ref refs/heads/main && exit 0
            sleep $((try * 20))
          done
          echo "::error::could not dispatch the next run; the cron restarts the chain"; exit 1
