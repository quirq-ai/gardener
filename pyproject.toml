[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "qqgarden"
version = "0.1.0"
description = "The quirq infra (qq) gardener: keeps main green with tree status, bisection and capped reverts."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# jsonschema: qqcfg validate (infra-config's loader, imported from the pinned checkout).
# qqresults: the results store and failure records, by pinned commit (pins.toml [test-pipelines]).
dependencies = [
  "jsonschema==4.26.0",
  "qqresults @ git+https://github.com/quirq-ai/test-pipelines@ece61c0f1af4549e7da09f6b7ded3dcbc174f77c",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
qqgarden = "qqgarden.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
